services:
  - type: web
    name: ai-publisher-pro
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Single worker on purpose: APSV2Service keeps job/task/semaphore state
    # in-process (no shared store yet), so >1 worker means a job created on one
    # worker is invisible to another → random "job not found". Matches the
    # Dockerfile CMD. Raise this only after job state moves to a shared store.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://translate.prismy.in,https://prismy.in"
      - key: PYTHON_VERSION
        value: "3.11.0"
    domains:
      - translate.prismy.in
