[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=core
    --cov=core_v2
    --cov=api
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # Honest floor = current real coverage (~41% after the dead-code cleanup).
    # Ratchet UP over time; never lower. Was 50, which never matched reality
    # (coverage-gate theater — see docs/TECH_DEBT_AND_ROADMAP.md, P1-T1).
    --cov-fail-under=40

# Asyncio configuration
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests for core modules
    integration: Integration tests for API endpoints
    slow: Slow running tests
    api_call: Tests that make real API calls (skip by default)

# Ignore paths
norecursedirs = .git .tox dist build *.egg legacy data uploads htmlcov
