name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  import-smoke:
    # Clean-room import check: install ONLY requirements.txt — exactly what
    # Render's buildCommand does — then prove the app imports and the settings
    # accessor resolves. Catches a missing production dependency (e.g.
    # SQLAlchemy, imported by the glossary/TM routers) and a missing
    # get_settings() before they reach production. Both were real P0 outages.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production requirements only (no dev/test extras)
        run: pip install -r requirements.txt
      - name: Import api.main + resolve get_settings()
        # Also import core.health_monitor: the /health route imports it lazily
        # (inside the handler), so a plain `import api.main` does NOT surface a
        # missing prod dep like psutil — it only 500s at request time. Importing
        # it here turns that runtime outage into a red import-smoke, and guards
        # against psutil being dropped from requirements.txt again.
        run: |
          python -c "import api.main; import core.health_monitor; from config.settings import get_settings; assert get_settings() is not None; print('import-smoke OK')"
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

  backend-tests:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -x -q --tb=short --no-cov
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Run API endpoint tests
        run: pytest tests/api/ -v --tb=short --no-cov
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key
          SECURITY_MODE: development

      - name: Run security tests
        run: pytest tests/security/ -v --tb=short --no-cov
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Run core module tests
        run: pytest tests/core/ -v --tb=short --no-cov
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Run eval-harness tests (offline; scoring + gate logic)
        # The evalkit scorers/runner are unit-tested with a mock translator and
        # mock judge — no API key, no network. The live quality gate that runs
        # the real engine needs a provider key and is run on demand, not in CI.
        run: pytest tests/eval/ -q --tb=short --no-cov
        env:
          DATABASE_BACKEND: sqlite

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --no-cov
        continue-on-error: true
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Run remaining suites (batch, rri_t, e2e, streaming, v2, root)
        # Everything the per-directory steps above miss — previously these trees
        # were never exercised in CI, which let a Python-3.11 syntax error and a
        # batch of stale expectations sit unnoticed. Live-server E2E (tests/v2)
        # and manual driver scripts self-skip.
        run: pytest tests/batch/ tests/rri_t/ tests/e2e/ tests/streaming/ tests/v2/ tests/*.py -q --tb=short --no-cov
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Coverage report
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/unit/ tests/api/ tests/security/ tests/core/ \
            --cov=core --cov=core_v2 --cov=api \
            --cov-report=xml --cov-report=term-missing \
            -q --tb=short
        env:
          DATABASE_BACKEND: sqlite
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Upload coverage
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  frontend-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

      - name: Type check
        # Hard gate (was continue-on-error): tsc passes today, so type errors
        # from now on fail the build instead of scrolling by unnoticed.
        working-directory: frontend
        run: npx tsc --noEmit
