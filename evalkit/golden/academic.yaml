# Golden set — academic / STEM EN<->VI. Exercises format preservation:
# display + inline formulas, numbered lists, and tables must survive translation.
- id: acad-formula-01
  direction: en2vi
  domain: academic
  source: 'By the chain rule, $\frac{dy}{dx} = \frac{dy}{du}\frac{du}{dx}$ holds.'
  reference: 'Theo quy tắc dây chuyền, $\frac{dy}{dx} = \frac{dy}{du}\frac{du}{dx}$ đúng.'
  expect_terms: ["quy tắc dây chuyền"]
  expect_no_translate: ['$\frac{dy}{dx} = \frac{dy}{du}\frac{du}{dx}$']

- id: acad-theorem-02
  direction: en2vi
  domain: academic
  source: "Theorem 1. If $f$ is continuous on a closed interval, then $f$ attains its maximum."
  reference: "Định lý 1. Nếu $f$ liên tục trên một khoảng đóng, thì $f$ đạt giá trị lớn nhất."
  expect_terms: ["định lý", "liên tục"]
  expect_no_translate: ["$f$"]

- id: acad-list-03
