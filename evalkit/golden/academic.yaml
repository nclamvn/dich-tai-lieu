    1. thu thập dữ liệu
    2. huấn luyện mô hình
    3. đánh giá kết quả
  reference: |-
    The experimental procedure has three steps:
    1. collect the data
    2. train the model
    3. evaluate the results
  expect_terms: ["procedure", "train the model"]

